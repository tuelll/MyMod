name: Compilar Mod GTA AML

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Instalar Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Compilar usando ndk-build
        run: |
          mkdir -p jni
          
          # Move seus arquivos respeitando as letras maiusculas
          mv -f Android.mk jni/Android.mk 2>/dev/null || true
          mv -f Application.mk jni/Application.mk 2>/dev/null || true
          mv -f Audio.cpp jni/Audio.cpp 2>/dev/null || true
          mv -f Audio.h jni/Audio.h 2>/dev/null || true
          mv -f ImprovedIdles.cpp jni/ImprovedIdles.cpp 2>/dev/null || true
          
          # Executa a compilacao oficial do NDK
          $ANDROID_NDK_LATEST_HOME/ndk-build NDK_PROJECT_PATH=. NDK_APPLICATION_MK=jni/Application.mk

      - name: Disponibilizar Mod Pronto
        uses: actions/upload-artifact@v4
        with:
          name: mod-gta-completo
          path: libs/
          
