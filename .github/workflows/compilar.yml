name: Compilar Novo Mod GTA AML

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo do Mod
        uses: actions/checkout@v4
        with:
          path: meu-mod

      - name: Baixar a SDK Oficial do AML
        uses: actions/checkout@v4
        with:
          repository: RusJJ/AndroidModLoader
          path: aml-sdk

      - name: Instalar Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Organizar Pastas e Corrigir Codigo
        run: |
          # 1. Cria a estrutura oficial JNI exigida pelo NDK
          mkdir -p jni
          
          # 2. Move os seus arquivos locais para dentro da pasta jni
          cp -f meu-mod/Android.mk jni/Android.mk 2>/dev/null || true
          cp -f meu-mod/Application.mk jni/Application.mk 2>/dev/null || true
          cp -f meu-mod/main.cpp jni/main.cpp 2>/dev/null || true
          # Copia também outros arquivos .cpp/.h que você tiver (como logger ou config se forem seus)
          cp -f meu-mod/*.cpp jni/ 2>/dev/null || true
          cp -f meu-mod/*.h jni/ 2>/dev/null || true
          
          # 3. Copia a pasta de cabeçalhos e códigos 'mod' da SDK diretamente para dentro de jni
          cp -r aml-sdk/mod jni/mod
          
          # 4. Modifica o Android.mk para incluir os arquivos essenciais da SDK do AML
          # Se o seu Android.mk já tiver logger.cpp e config.cpp na lista, isso garante que não quebre
          sed -i 's/LOCAL_SRC_FILES :=/LOCAL_SRC_FILES := mod\/logger.cpp mod\/config.cpp/g' jni/Android.mk
          
          # 5. CORREÇÃO EXATA DOS PARÊNTESES E DA LETRA 'a' SOLTA
          # Remove a tentativa antiga de criar uma macro quebrada
          rm -f jni/patch_aml.h
          touch jni/patch_aml.h
          
          # Correções diretas e cirúrgicas no texto da main.cpp antes de compilar:
          echo "Aplicando correções de sintaxe na main.cpp..."
          
          # Corrige a linha 92
          sed -i 's/\*out = ((void\*)(aml->GetSym(hGTASA, name);/*out = (void*)(aml->GetSym(hGTASA, name));/g' jni/main.cpp
          
          # Corrige as linhas de Process, Restart e Resurr fechando os parênteses devidamente
          sed -i 's/((void\*)(aml->GetSym(hGTASA, "_ZN5CGame7ProcessEv");/(void*)(aml->GetSym(hGTASA, "_ZN5CGame7ProcessEv"));/g' jni/main.cpp
          sed -i 's/((void\*)(aml->GetSym(hGTASA, "_ZN5CGame24InitialiseWhenRestartingEv");/(void*)(aml->GetSym(hGTASA, "_ZN5CGame24InitialiseWhenRestartingEv"));/g' jni/main.cpp
          sed -i 's/((void\*)(aml->GetSym(hGTASA, "_ZN10CGameLogic36RestorePlayerStuffDuringResurrectionEP10CPlayerPed7CVectorf");/(void*)(aml->GetSym(hGTASA, "_ZN10CGameLogic36RestorePlayerStuffDuringResurrectionEP10CPlayerPed7CVectorf"));/g' jni/main.cpp
          
          # Limpa aquela letra 'a' ou string cortada que ficou grudada no if (sRestart)
          sed -i 's/if (sRestart) a/if (sRestart) {}/g' jni/main.cpp
          sed -i 's/void\* sResurr  = Sym("_ZN1/void* sResurr = nullptr;/g' jni/main.cpp
          
          # 6. Executa a compilação oficial usando o NDK r27 instalado pelo action
          # Usamos o caminho correto do NDK do tool-cache ($ANDROID_NDK_HOME)
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=jni/Application.mk \
            APP_ABI=armeabi-v7a \
            APP_PLATFORM=android-21

      - name: Disponibilizar Mod Pronto
        uses: actions/upload-artifact@v4
        with:
          name: mod-gta-completo
          path: libs/armeabi-v7a/
          
