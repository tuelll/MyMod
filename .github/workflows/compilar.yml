name: Compilar Mod GTA AML

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo do Mod
        uses: actions/checkout@v4
        with:
          path: meu-mod

      - name: Baixar a SDK Oficial do AML
        uses: actions/checkout@v4
        with:
          repository: RusJJ/AndroidModLoader
          path: aml-sdk

      - name: Instalar Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Organizar Pastas e Compilar
        run: |
          # 1. Cria a estrutura oficial JNI exigida pelo NDK
          mkdir -p jni
          
          # 2. Move os seus arquivos locais para dentro da pasta jni
          mv -f meu-mod/Android.mk jni/Android.mk 2>/dev/null || true
          mv -f meu-mod/Application.mk jni/Application.mk 2>/dev/null || true
          mv -f meu-mod/Audio.cpp jni/Audio.cpp 2>/dev/null || true
          mv -f meu-mod/Audio.h jni/Audio.h 2>/dev/null || true
          mv -f meu-mod/ImprovedIdles.cpp jni/ImprovedIdles.cpp 2>/dev/null || true
          
          # 3. Copia a pasta de cabeçalhos e códigos 'mod' da SDK diretamente para dentro de jni
          cp -r aml-sdk/mod jni/mod
          
          # 4. Corrige o Android.mk adicionando o logger.cpp na lista de compilação
          sed -i 's/LOCAL_SRC_FILES :=/LOCAL_SRC_FILES := mod\/logger.cpp/g' jni/Android.mk
          
          # 5. AJUSTE CIRÚRGICO: Remove qualquer macro antiga e cria um apelido seguro (typedef)
          # Injetamos o tipo customizado aml_SafeConfig_t diretamente apontando para o escopo raiz ::aml::Config
          # E alteramos a chamada física da macro no ImprovedIdles.cpp para usar esse tipo limpo
          sed -i 's/#include <mod\/amlmod.h>/#include <mod\/amlmod.h>\ntypedef ::aml::Config aml_SafeConfig_t;/g' jni/ImprovedIdles.cpp
          sed -i 's/#include "mod\/amlmod.h"/#include "mod\/amlmod.h"\ntypedef ::aml::Config aml_SafeConfig_t;/g' jni/ImprovedIdles.cpp
          
          # Substitui a palavra Config usada pela macro pelo nosso tipo que ignora a variável local 'aml'
          sed -i 's/\bConfig\b/aml_SafeConfig_t/g' jni/ImprovedIdles.cpp
          
          # 6. Executa a compilação oficial mapeando as pastas necessárias
          $ANDROID_NDK_LATEST_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=jni/Application.mk \
            NDK_APP_INCLUDES+="jni jni/mod"

      - name: Disponibilizar Mod Pronto
        uses: actions/upload-artifact@v4
        with:
          name: mod-gta-completo
          path: libs/
          
