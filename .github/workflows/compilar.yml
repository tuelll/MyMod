name: Compilar Mod GTA AML Realistic Damage

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo do Mod
        uses: actions/checkout@v4
        with:
          path: meu-mod

      - name: Baixar a SDK Oficial do AML
        uses: actions/checkout@v4
        with:
          repository: RusJJ/AndroidModLoader
          path: aml-sdk

      - name: Instalar Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Organizar Pastas e Compilar
        run: |
          # 1. Cria a estrutura oficial JNI exigida pelo NDK
          mkdir -p jni
          
          # 2. Move os seus 3 arquivos locais para dentro da pasta jni
          mv -f meu-mod/Android.mk jni/Android.mk 2>/dev/null || true
          mv -f meu-mod/Application.mk jni/Application.mk 2>/dev/null || true
          mv -f meu-mod/realistic_damage.cpp jni/realistic_damage.cpp 2>/dev/null || true
          
          # 3. Copia a pasta de cabeçalhos e códigos 'mod' da SDK diretamente para dentro de jni
          cp -r aml-sdk/mod jni/mod
          
          # 4. Modifica cirurgicamente o Android.mk para INCLUIR os arquivos de suporte da SDK do AML
          # Isso garante a correta compilação e linkagem do Config e Logger
          sed -i 's/LOCAL_SRC_FILES :=/LOCAL_SRC_FILES := mod\/logger.cpp mod\/config.cpp/g' jni/Android.mk
          
          # 5. CORREÇÃO JNI: Resolve o problema clássico de tipo incompleto ou oculto do namespace 'aml'
          cat << 'EOF' > jni/patch_aml.h
          #pragma once
          #include <mod/config.h>
          typedef class Config aml_Config_Safe_t;
          EOF
          
          sed -i '1s/^/#include "patch_aml.h"\n/' jni/realistic_damage.cpp
          sed -i 's/\bConfig\b/aml_Config_Safe_t/g' jni/realistic_damage.cpp
          
          # 6. Executa a compilação oficial mapeando as pastas e flags nativas do compilador
          $ANDROID_NDK_LATEST_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=jni/Application.mk \
            NDK_APP_INCLUDES+="jni jni/mod" \
            APP_CFLAGS="-Ijni/mod" \
            APP_CPPFLAGS="-Ijni/mod"

      - name: Disponibilizar Mod Pronto
        uses: actions/upload-artifact@v4
        with:
          name: mod-gta-damage
          path: libs/
          
