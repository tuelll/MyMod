name: Compilar Mod GTA AML
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Instalar Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Compilar usando ndk-build
        run: |
          # Cria a estrutura correta que o NDK exige
          mkdir -p jni
          
          # Move seus arquivos para a pasta jni caso estejam na raiz
          mv -f Android.mk Application.mk audio.cpp audio.h improvedidles.cpp jni/ 2>/dev/null || true
          
          # Executa a compilação nativa oficial
          $ANDROID_NDK_LATEST_HOME/ndk-build NDK_PROJECT_PATH=. NDK_APPLICATION_MK=jni/Application.mk

      - name: Disponibilizar Mod Pronto
        uses: actions/upload-artifact@v4
        with:
          name: mod-gta-completo
          path: libs/
          
