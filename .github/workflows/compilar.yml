name: Compilar Mod GTA AML

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo do Mod
        uses: actions/checkout@v4
        with:
          path: meu-mod

      - name: Baixar a SDK Oficial do AML
        uses: actions/checkout@v4
        with:
          repository: RusJJ/AndroidModLoader
          path: aml-sdk

      - name: Instalar Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Organizar Pastas e Corrigir Codigo
        run: |
          # 1. Cria a estrutura oficial JNI exigida pelo NDK
          mkdir -p jni
          
          # 2. Move os seus arquivos locais para dentro da pasta jni
          mv -f meu-mod/Android.mk jni/Android.mk 2>/dev/null || true
          mv -f meu-mod/Application.mk jni/Application.mk 2>/dev/null || true
          mv -f meu-mod/Audio.cpp jni/Audio.cpp 2>/dev/null || true
          mv -f meu-mod/Audio.h jni/Audio.h 2>/dev/null || true
          mv -f meu-mod/ImprovedIdles.cpp jni/ImprovedIdles.cpp 2>/dev/null || true
          
          # 3. Copia a pasta de cabeçalhos 'mod' do AML para dentro de jni
          cp -r aml-sdk/mod jni/mod
          
          # 4. Cria um cabeçalho auxiliar usando o operador de escopo global (::aml)
          cat << 'EOF' > jni/aml_fix.h
          #pragma once
          #include <mod/amlmod.h>
          #include <mod/config.h>
          // O prefixo :: garante que o compilador busque o namespace raiz, ignorando a variável aml
          typedef ::aml::Config aml_Config_t;
          EOF
          
          # 5. Modifica temporariamente o ImprovedIdles.cpp para usar o tipo corrigido
          sed -i 's/\bConfig\b/aml_Config_t/g' jni/ImprovedIdles.cpp
          sed -i '1s/^/#include "aml_fix.h"\n/' jni/ImprovedIdles.cpp
          
          # 6. Executa a compilação oficial usando o NDK r27
          $ANDROID_NDK_LATEST_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=jni/Application.mk \
            NDK_APP_INCLUDES+=jni

      - name: Disponibilizar Mod Pronto
        uses: actions/upload-artifact@v4
        with:
          name: mod-gta-completo
          path: libs/
          
