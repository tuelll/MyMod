name: Compilar Mod AML
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Instalar Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Compilar com Clang (32 e 64 bits)
        run: |
          mkdir -p libs/armeabi-v7a
          # Compila a versão de 32 bits para o seu celular
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang++ \
            -shared -fPIC -O2 main.cpp -o libs/armeabi-v7a/libmeumod.so

      - name: Guardar Mod Pronto
        uses: actions/upload-artifact@v4
        with:
          name: meu-mod-gta-sa
          path: libs/
          
