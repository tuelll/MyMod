      - name: Compilar usando ndk-build
        run: |
          mkdir -p jni
          
          # Move e garante que os nomes fiquem exatamente como o Android.mk quer
          mv -f Android.mk Application.mk jni/ 2>/dev/null || true
          mv -f audio.cpp jni/audio.cpp 2>/dev/null || mv -f Audio.cpp jni/audio.cpp 2>/dev/null || true
          mv -f audio.h jni/audio.h 2>/dev/null || mv -f Audio.h jni/audio.h 2>/dev/null || true
          mv -f improvedidles.cpp jni/ImprovedIdles.cpp 2>/dev/null || mv -f ImprovedIdles.cpp jni/ImprovedIdles.cpp 2>/dev/null || true
          
          # Executa a compilação nativa
          $ANDROID_NDK_LATEST_HOME/ndk-build NDK_PROJECT_PATH=. NDK_APPLICATION_MK=jni/Application.mk
          
